server:
  port: ${USER_SERVICE_PORT:8082}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobrec}
    username: ${DB_USER:user_svc}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: users
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: users
    default-schema: users
jwt:
  secret: ${JWT_SECRET:very_secret_default_key_that_is_at_least_256_bits_long_placeholder}
internal:
  api-key: ${INTERNAL_API_KEY:internal_key_placeholder}
ml:
  client:
    mode: ${ML_CLIENT_MODE:stub}
ml-service:
  base-url: ${ML_SERVICE_URL:http://localhost:8000}
  connect-timeout-ms: ${ML_SERVICE_CONNECT_TIMEOUT_MS:1000}
  read-timeout-ms: ${ML_SERVICE_READ_TIMEOUT_MS:5000}
