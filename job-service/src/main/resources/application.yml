server:
  port: ${JOB_SERVICE_PORT:8083}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring:
  application:
    name: job-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobrec}
    username: ${DB_USER:job_svc}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: jobs
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: jobs
    default-schema: jobs
jwt:
  secret: ${JWT_SECRET:very_secret_default_key_that_is_at_least_256_bits_long_placeholder}
internal:
  api-key: ${INTERNAL_API_KEY:internal_key_placeholder}
