server:
  port: ${GATEWAY_PORT:8080}
spring:
  application:
    name: gateway
  cloud:
    discovery:
      enabled: false
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates: [Path=/api/auth/**]
        - id: user-profile-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates: [Path=/api/profile/**]
        - id: user-candidate-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates: [Path=/api/candidates/**]
        - id: user-compatibility-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates: [Path=/api/users/**]
        - id: job-service
          uri: ${JOB_SERVICE_URL:http://localhost:8083}
          predicates: [Path=/api/jobs/**]
        - id: application-service
          uri: ${APPLICATION_SERVICE_URL:http://localhost:8084}
          predicates: [Path=/api/applications/**]
        - id: recommendation-service
          uri: ${RECOMMENDATION_SERVICE_URL:http://localhost:8085}
          predicates: [Path=/api/recommendations/**]
        - id: recruiter-recommendation-service
          uri: ${RECOMMENDATION_SERVICE_URL:http://localhost:8085}
          predicates: [Path=/api/recruiter/**]
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates: [Path=/api/notifications/**]
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowedHeaders: '*'
            allowCredentials: true
      discovery:
        locator:
          enabled: false
