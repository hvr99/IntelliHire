server:
  port: ${RECOMMENDATION_SERVICE_PORT:8085}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring:
  application:
    name: recommendation-service
recommendation:
  clients:
    mode: ${RECOMMENDATION_CLIENT_MODE:stub}
  page:
    default-size: ${RECOMMENDATION_DEFAULT_SIZE:20}
    max-size: ${RECOMMENDATION_MAX_SIZE:100}
  semantic:
    mode: ${RECOMMENDATION_SEMANTIC_MODE:noop}
    timeout-ms: ${RECOMMENDATION_SEMANTIC_TIMEOUT_MS:750}
    blend: ${RECOMMENDATION_SEMANTIC_BLEND:0.20}
job-service:
  base-url: ${JOB_SERVICE_URL:http://localhost:8083}
user-service:
  base-url: ${USER_SERVICE_URL:http://localhost:8082}
application-service:
  base-url: ${APPLICATION_SERVICE_URL:http://localhost:8084}
ml-service:
  base-url: ${ML_SERVICE_URL:http://localhost:8000}
internal:
  api-key: ${INTERNAL_API_KEY:internal_key_placeholder}
jwt:
  secret: ${JWT_SECRET:very_secret_default_key_that_is_at_least_256_bits_long_placeholder}
