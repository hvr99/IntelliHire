server:
  port: ${NOTIFICATION_SERVICE_PORT:8086}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobrec}
    username: ${DB_USER:notification_svc}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: notifications
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: notifications
    default-schema: notifications
jwt:
  secret: ${JWT_SECRET:very_secret_default_key_that_is_at_least_256_bits_long_placeholder}
internal:
  api-key: ${INTERNAL_API_KEY:internal_key_placeholder}
recommendation-notifications:
  enabled: ${RECOMMENDATION_NOTIFICATIONS_ENABLED:false}
  min-score: ${RECOMMENDATION_NOTIFICATIONS_MIN_SCORE:80}
