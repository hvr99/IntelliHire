server:
  port: ${APPLICATION_SERVICE_PORT:8084}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring:
  application:
    name: application-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobrec}
    username: ${DB_USER:application_svc}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: applications
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: applications
    default-schema: applications
jwt:
  secret: ${JWT_SECRET:very_secret_default_key_that_is_at_least_256_bits_long_placeholder}
internal:
  api-key: ${INTERNAL_API_KEY:internal_key_placeholder}
notification-service:
  base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
  connect-timeout-ms: ${NOTIFICATION_SERVICE_CONNECT_TIMEOUT_MS:1000}
  read-timeout-ms: ${NOTIFICATION_SERVICE_READ_TIMEOUT_MS:2000}
job-service:
  base-url: ${JOB_SERVICE_URL:http://localhost:8083}
  connect-timeout-ms: ${JOB_SERVICE_CONNECT_TIMEOUT_MS:1000}
  read-timeout-ms: ${JOB_SERVICE_READ_TIMEOUT_MS:2000}
